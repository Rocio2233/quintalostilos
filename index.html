<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QuintaLosTilos" />
  <title>QuintaLosTilos - Planificador Compartido</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fafaf9;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="text-stone-800 antialiased pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-stone-200/80 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-xl shadow-xs">
          🌳
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-stone-900 leading-none">
              Quinta<span class="text-emerald-600">LosTilos</span>
            </h1>
            <span id="badge-sync" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">
              Local
            </span>
          </div>
          <p class="text-xs text-stone-500 mt-0.5">Menú por día, ingredientes e insumos compartidos</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" onclick="generarTotalInsumos()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm py-2 px-3.5 rounded-xl shadow-xs flex items-center gap-1.5 transition active:scale-[0.98]">
          <span>🛒</span>
          <span>Total de Insumos</span>
        </button>
        <button type="button" onclick="abrirModalSync()" title="Configurar vista compartida" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200/70 text-stone-700 border border-stone-200 text-xs font-bold transition">
          ☁️
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-5 space-y-6">

    <!-- Panel Total de Insumos (se muestra arriba al tocar el botón) -->
    <section id="panel-compras" class="hidden bg-white rounded-3xl border-2 border-emerald-600/20 shadow-md overflow-hidden">
      <div class="bg-emerald-900 text-white p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-base sm:text-lg font-extrabold flex items-center gap-2">
            <span>🛒</span> Total de Insumos de la Semana
          </h2>
          <p id="subtitulo-compras" class="text-xs text-emerald-200 mt-0.5">Suma consolidada de todos los días activos</p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="copiarListaWhatsApp()" class="bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-extrabold text-xs px-3 py-2 rounded-xl transition">
            📲 Copiar para WhatsApp
          </button>
          <button type="button" onclick="cerrarPanelCompras()" class="bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-2 rounded-xl transition">
            ✕
          </button>
        </div>
      </div>

      <div id="aviso-sobras" class="hidden bg-amber-50 border-b border-amber-200 px-5 py-2 text-xs text-amber-800 font-semibold flex items-center gap-2">
        <span>♻️</span>
        <span id="texto-aviso-sobras"></span>
      </div>

      <div class="px-5 pt-4">
        <div class="flex justify-between text-xs font-bold text-stone-500 mb-1.5">
          <span>Progreso en el súper</span>
          <span id="progreso-texto">0 / 0</span>
        </div>
        <div class="w-full bg-stone-100 h-2 rounded-full overflow-hidden">
          <div id="progreso-barra" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <div id="contenedor-rubros" class="p-4 sm:p-5 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- Barra de ideas rápidas y utilidades -->
    <section class="bg-white rounded-2xl p-3.5 border border-stone-200/80 shadow-2xs space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span class="text-xs font-bold uppercase tracking-wider text-stone-400">Carga rápida al próximo turno libre</span>
        <div class="flex items-center gap-3">
          <button type="button" onclick="copiarMenuWhatsApp()" class="text-xs font-bold text-emerald-700 hover:underline">
            📲 Copiar menú
          </button>
          <button type="button" onclick="limpiarSemana()" class="text-xs font-semibold text-rose-500 hover:underline">
            Limpiar semana
          </button>
        </div>
      </div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        <button type="button" onclick="asignarRapido('Comer las sobras')" class="shrink-0 px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 text-xs font-bold transition">
          ♻️ Comer las sobras
        </button>
        <button type="button" onclick="asignarRapido('Tarta de verdura')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-700 text-xs font-semibold transition">
          🥬 Tarta de verdura
        </button>
        <button type="button" onclick="asignarRapido('Tarta caprese')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-700 text-xs font-semibold transition">
          🥧 Tarta caprese
        </button>
        <button type="button" onclick="asignarRapido('Asado con ensalada')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-700 text-xs font-semibold transition">
          🥩 Asado con ensalada
        </button>
        <button type="button" onclick="asignarRapido('Ensalada César con pollo')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-700 text-xs font-semibold transition">
          🥗 Ensalada César
        </button>
        <button type="button" onclick="asignarRapido('Tortilla de papas')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-700 text-xs font-semibold transition">
          🍳 Tortilla de papas
        </button>
        <button type="button" onclick="asignarRapido('Pastel de papas')" class="shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-50 text-stone-700 hover:text-emerald-700 text-xs font-semibold transition
